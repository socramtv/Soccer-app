<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduciendo: {{ canal_name }}</title>
    
    <!-- Librería HLS.js para reproducir m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* 🔴 MARCA DE AGUA (ESTILO APP ORIGINAL) */
        .watermark {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 9999;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-shadow: 2px 2px 10px rgba(0,0,0,1), 0px 0px 5px rgba(0,0,0,0.8);
            user-select: none;
            opacity: 0.85; 
        }

        .wm-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .watermark-sub {
            font-size: 0.7rem;
            color: #00ff88; 
            font-weight: bold;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* 🛠️ CONTROLES ORIGINALES: VLC, WVC, COPIAR Y VOLVER */
        .top-controls {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10000;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
            max-width: 60%;
        }

        .btn-tool {
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s ease;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #ffffff;
        }

        /* Colores específicos para que sean fáciles de identificar */
        .btn-wvc { color: #ffaa00; border-color: rgba(255, 170, 0, 0.3); }
        .btn-vlc { color: #ff8800; border-color: rgba(255, 136, 0, 0.3); }
        .btn-copy { color: #66c2ff; border-color: rgba(102, 194, 255, 0.3); }
        .btn-back { color: #00ff88; border-color: rgba(0, 255, 136, 0.3); }

    </style>
</head>
<body>

    <div class="player-wrapper">
        
        <!-- MARCA DE AGUA FLOTANTE -->
        <div class="watermark">
            <span class="wm-title">Sσcяαм Tν + Acεѕтяεαм</span>
            <span class="watermark-sub">BY MASP</span>
        </div>

        <!-- TUS BOTONES ORIGINALES RESTAURADOS -->
        <div class="top-controls">
            <button onclick="abrirWVC()" class="btn-tool btn-wvc">📡 Web Video Cast</button>
            <button onclick="abrirVLC()" class="btn-tool btn-vlc">🧡 VLC</button>
            <button onclick="copiarEnlace()" class="btn-tool btn-copy">📋 Copiar Enlace</button>
            <a href="/" class="btn-tool btn-back">⬅ Volver</a>
        </div>

        <!-- REPRODUCTOR -->
        <video id="video-player" controls autoplay playsinline></video>

    </div>

    <script>
        var video = document.getElementById('video-player');
        var urlStream = "{{ stream_url }}";

        // 1. ABRIR EN WEB VIDEO CASTER DIRECTAMENTE (Sin pasar por el navegador)
        function abrirWVC() {
            var cleanUrl = urlStream.replace(/^https?:\/\//, '');
            var scheme = urlStream.startsWith('https') ? 'https' : 'http';
            var intent = "intent://" + cleanUrl + "#Intent;package=com.instantbits.cast.webvideo;action=android.intent.action.VIEW;scheme=" + scheme + ";type=video/*;end;";
            window.location.href = intent;
        }

        // 2. ABRIR EN VLC DIRECTAMENTE
        function abrirVLC() {
            var cleanUrl = urlStream.replace(/^https?:\/\//, '');
            var scheme = urlStream.startsWith('https') ? 'https' : 'http';
            var intent = "intent://" + cleanUrl + "#Intent;package=org.videolan.vlc;action=android.intent.action.VIEW;scheme=" + scheme + ";type=video/*;end;";
            window.location.href = intent;
        }

        // 3. COPIAR ENLACE AL PORTAPAPELES
        function copiarEnlace() {
            // Creamos un input temporal para copiar de forma compatible con móviles antiguos
            var tempInput = document.createElement("input");
            tempInput.value = urlStream;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand("copy");
                alert("✅ Enlace copiado correctamente:\n" + urlStream);
            } catch (err) {
                alert("❌ Error al copiar el enlace.");
            }
            document.body.removeChild(tempInput);
        }

        // Inicialización del motor HLS para el vídeo integrado
        if (Hls.isSupported()) {
            var hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
            });
            hls.loadSource(urlStream);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function() {
                    console.log("Se requiere interacción manual para el audio.");
                });
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = urlStream;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
