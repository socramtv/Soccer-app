<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduciendo: {{ canal_name }}</title>
    
    <!-- Librería HLS.js para reproducir m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* 🔴 MARCA DE AGUA (ESTILO APP ORIGINAL) */
        .watermark {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 9000;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-shadow: 2px 2px 10px rgba(0,0,0,1), 0px 0px 5px rgba(0,0,0,0.8);
            user-select: none;
            opacity: 0.85; 
        }

        .wm-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .watermark-sub {
            font-size: 0.7rem;
            color: #00ff88; 
            font-weight: bold;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* 🛠️ CONTROLES SUPERIORES (TRANSMITIR Y VOLVER) */
        .top-controls {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10000;
            display: flex;
            gap: 10px;
        }

        .btn-tool {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-tool:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-cast { color: #00ff88; border-color: rgba(0, 255, 136, 0.3); }
        .btn-back { color: #ffffff; border-color: rgba(255, 255, 255, 0.3); }


        /* 🪟 MENÚ MODAL DE TRANSMISIÓN (ESTILO ORIGINAL) */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1c1c1e;
            width: 90%;
            max-width: 400px;
            border-radius: 14px;
            padding: 20px;
            color: white;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 1px solid #2c2c2e;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2c2c2e;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .modal-title {
            color: #00ff88;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .close-btn {
            background: none; 
            border: none; 
            color: #888; 
            font-size: 1.4rem; 
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover { color: #fff; }

        .cast-option {
            display: flex;
            align-items: center;
            background: #28282b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid #333;
        }

        .cast-option:hover { background: #353538; }
        .cast-option:last-child { margin-bottom: 0; }

        .cast-icon {
            font-size: 1.8rem;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .cast-text-block {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .cast-title {
            font-size: 0.95rem;
            font-weight: bold;
            color: #fff;
        }

        .cast-subtitle {
            font-size: 0.75rem;
            color: #999;
            line-height: 1.3;
        }

    </style>
</head>
<body>

    <div class="player-wrapper">
        
        <!-- MARCA DE AGUA FLOTANTE -->
        <div class="watermark">
            <span class="wm-title">Sσcяαм Tν + Acεѕтяεαм</span>
            <span class="watermark-sub">BY MASP</span>
        </div>

        <!-- CONTROLES PARA ABRIR MENÚ Y VOLVER -->
        <div class="top-controls">
            <button onclick="abrirModal()" class="btn-tool btn-cast">📺 Transmitir</button>
            <a href="/" class="btn-tool btn-back">⬅ Volver</a>
        </div>

        <!-- REPRODUCTOR -->
        <video id="video-player" controls autoplay playsinline></video>

    </div>

    <!-- MENÚ MODAL DE TRANSMISIÓN -->
    <div id="castModal" class="modal-overlay" onclick="cerrarModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            
            <div class="modal-header">
                <div class="modal-title">📺 Transmitir en Smart TV</div>
                <button class="close-btn" onclick="cerrarModal(null, true)">✕</button>
            </div>
            
            <div class="cast-option" onclick="abrirWVC()">
                <div class="cast-icon">🌐</div>
                <div class="cast-text-block">
                    <span class="cast-title">Web Video Caster</span>
                    <span class="cast-subtitle">Recomendado para LG, Samsung, Chromecast</span>
                </div>
            </div>

            <div class="cast-option" onclick="abrirVLC()">
                <div class="cast-icon">🟠</div>
                <div class="cast-text-block">
                    <span class="cast-title">VLC Media Player</span>
                    <span class="cast-subtitle">Casteo mediante botón de Chromecast integrado</span>
                </div>
            </div>

            <div class="cast-option" onclick="copiarEnlace()">
                <div class="cast-icon">📋</div>
                <div class="cast-text-block">
                    <span class="cast-title">Copiar Enlace HLS (.m3u8)</span>
                    <span class="cast-subtitle">Para pegar en apps IPTV de tu Smart TV</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        var video = document.getElementById('video-player');
        var urlStream = "{{ stream_url }}";

        // GESTIÓN DEL MENÚ MODAL
        function abrirModal() {
            document.getElementById('castModal').style.display = 'flex';
        }

        function cerrarModal(e, force = false) {
            if (force || e.target.id === 'castModal') {
                document.getElementById('castModal').style.display = 'none';
            }
        }

        // 1. ABRIR EN WEB VIDEO CASTER (Forzando inicio directo como vídeo)
        function abrirWVC() {
            // Usamos la URL completa en el cuerpo del intent y forzamos el type=video/*
            // Esto evita que WVC lo abra en su navegador y pase directamente al menú de casteo
            var intent = "intent:" + urlStream + "#Intent;package=com.instantbits.cast.webvideo;action=android.intent.action.VIEW;type=video/*;S.title=" + encodeURIComponent("{{ canal_name }}") + ";end;";
            window.location.href = intent;
            cerrarModal(null, true);
        }

        // 2. ABRIR EN VLC
        function abrirVLC() {
            var cleanUrl = urlStream.replace(/^https?:\/\//, '');
            var scheme = urlStream.startsWith('https') ? 'https' : 'http';
            var intent = "intent://" + cleanUrl + "#Intent;package=org.videolan.vlc;action=android.intent.action.VIEW;scheme=" + scheme + ";type=video/*;S.title=" + encodeURIComponent("{{ canal_name }}") + ";end;";
            window.location.href = intent;
            cerrarModal(null, true);
        }

        // 3. COPIAR ENLACE
        function copiarEnlace() {
            var tempInput = document.createElement("input");
            tempInput.value = urlStream;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand("copy");
                alert("✅ Enlace copiado correctamente:\n" + urlStream);
            } catch (err) {
                alert("❌ Error al copiar el enlace.");
            }
            document.body.removeChild(tempInput);
            cerrarModal(null, true);
        }

        // INICIALIZACIÓN DEL REPRODUCTOR
        if (Hls.isSupported()) {
            var hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
            });
            hls.loadSource(urlStream);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function() {
                    console.log("Se requiere interacción manual para el audio.");
                });
            });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = urlStream;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
