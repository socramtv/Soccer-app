<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduciendo: {{ canal_name }}</title>
    
    <!-- Librería HLS.js para reproducir m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* 🔴 ESTILOS DE LA MARCA DE AGUA (ESTILO ORIGINAL APP) */
        .watermark {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 9999;
            pointer-events: none; 
            display: flex;
            flex-direction: column;
            align-items: center; 
            text-shadow: 2px 2px 10px rgba(0,0,0,1), 0px 0px 5px rgba(0,0,0,0.8);
            user-select: none;
            opacity: 0.85; 
        }

        .wm-title {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .watermark-sub {
            font-size: 0.7rem;
            color: #00ff88; 
            font-weight: bold;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* 🔙 BOTONES SUPERIORES (TV Y VOLVER) */
        .top-right-controls {
            position: absolute;
            top: 25px;
            right: 25px;
            z-index: 10000;
            display: flex;
            gap: 10px;
        }

        .btn-action {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-action:hover {
            background: rgba(0, 255, 136, 0.3);
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-cast {
            background: rgba(0, 136, 255, 0.2);
            border-color: rgba(0, 136, 255, 0.4);
            color: #66c2ff;
        }

        .btn-cast:hover {
            background: rgba(0, 136, 255, 0.5);
            border-color: #66c2ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="player-wrapper">
        
        <!-- MARCA DE AGUA EN PANTALLA (IDÉNTICA A LA APP) -->
        <div class="watermark">
            <span class="wm-title">Sσcяαм Tν + Acεѕтяεαм</span>
            <span class="watermark-sub">BY MASP</span>
        </div>

        <!-- CONTROLES SUPERIORES DERECHOS -->
        <div class="top-right-controls">
            <button onclick="castToTV()" class="btn-action btn-cast">📺 Enviar a TV</button>
            <a href="/" class="btn-action">⬅ Volver</a>
        </div>

        <!-- REPRODUCTOR DE VIDEO (CON ATRIBUTOS DE CAST NATIVOS AÑADIDOS) -->
        <video id="video-player" controls autoplay playsinline x-webkit-airplay="allow" disableRemotePlayback="false"></video>

    </div>

    <script>
        var video = document.getElementById('video-player');
        var urlStream = "{{ stream_url }}";

        // Función personalizada para enviar a la TV
        function castToTV() {
            var isAndroid = /android/i.test(navigator.userAgent);
            
            if (isAndroid) {
                // En Android lanza directamente Web Video Caster mediante Intent
                var intentUrl = urlStream.replace(/^https?:\/\//, '');
                var scheme = urlStream.startsWith('https') ? 'https' : 'http';
                window.location.href = "intent://" + intentUrl + "#Intent;package=com.instantbits.cast.webvideo;action=android.intent.action.VIEW;scheme=" + scheme + ";type=video/*;end;";
            } else {
                // En otros sistemas intenta levantar el selector de Cast nativo si está disponible
                if (video.remote && video.remote.state !== 'disconnected') {
                    video.remote.prompt();
                } else if (window.WebKitPlaybackTargetAvailabilityEvent) {
                    video.webkitShowPlaybackTargetPicker();
                } else {
                    alert("Para enviar a la TV, pulsa el icono de transmitir en el reproductor si tu navegador lo soporta, o instala Web Video Caster.");
                }
            }
        }

        // Inicialización del motor HLS
        if (Hls.isSupported()) {
            var hls = new Hls({
                maxBufferLength: 30,
                maxMaxBufferLength: 60,
            });
            hls.loadSource(urlStream);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                video.play().catch(function(error) {
                    console.log("El navegador requiere interacción manual para reproducir el audio");
                });
            });
        }
        // Soporte nativo para Safari/iOS
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = urlStream;
            video.addEventListener('loadedmetadata', function() {
                video.play();
            });
        }
    </script>

</body>
</html>
